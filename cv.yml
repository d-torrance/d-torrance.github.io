# web only -- prose intro for the research page's Software section.
software_summary: >-
  I am an active developer of <a href="https://macaulay2.com/">Macaulay2</a>
  and member of the
  <a href="https://github.com/Macaulay2/M2/wiki/Internals%3A-Meeting-Notes">M2internals</a>
  group.  I am also a Debian Developer and maintain Macaulay2 and other
  related mathematics software for <a href="https://www.debian.org/">Debian</a>.

software:
  - name: Macaulay2
    url: https://macaulay2.com/
    start: 2010
    end: present
    summary: Software for research in algebraic geometry and commutative algebra.
    roles:
      - Member, "M2internals" group, which meets monthly on Zoom to discuss
        Macaulay2 development.
      - Active contributor, focusing on maintenance and improvement of the
        interpreter and build system.
      - Release manager, reviewing and merging pull requests and preparing
        binary releases.
      - Course release for 2023--2024 and 2025--2026 academic years, funded by
        the NSF through SLMath, for Macaulay2 development.
      - Author of ForeignFunctions, JSON, JSONRPC, Probability, Python,
        RInterface, TerraciniLoci, and Visualize packages.
      - Maintainer of Macaulay2 website.
      - Maintainer of PPA (personal package archive) for users to easily
        download and install Macaulay2 packages for Debian/Ubuntu systems.
  - name: Debian
    url: https://www.debian.org/
    start: 2013
    end: present
    roles:
      - Debian Developer with full uploading rights to the Debian archive
        (2021--present)
      - "Team membership: Debian Math Team (founding member), Debian Science
        Team, Debian Python Team, Debian R Team, Debian JavaScript Team"
      - Maintainer of a wide variety of mathematics packages, including 4ti2,
        Csdp, FFLAS-FFPACK, Gfan, Givaro, LinBox, Macaulay2, mpmath, nauty,
        Normaliz, PHCpack, and TOPCOM

