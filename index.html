---
layout: default
---

{%- assign profile = site.data.cv.profile -%}

<div id="front-page">
  <div id="front-text">
    <h3>Contact Information</h3>

    <ul class="fa-ul">
      <li><i class="fa-li fas fa-envelope"></i>
	E-mail: <a href="mailto:{{ profile.email }}">{{ profile.email }}</a>
      </li>
      <li><i class="fa-li fas fa-door-open"></i>Office: {{ profile.office }}</li>
      <li><i class="fa-li fas fa-phone"></i>Office Phone: {{ profile.phone }}</li>
      <li><i class="fa-li fas fa-clock"></i>Office Hours: {{ profile.office_hours }}</li>
    </ul>
  </div>
  <div id="front-pic">
    <img src="{{ site.url }}/{{ profile.photo }}" alt="{{ profile.short_name }}" id="headshot">
  </div>
</div>
