name: Build and deploy

# The site is no longer built by the default GitHub Pages Jekyll build, because
# the CV PDF needs LaTeX.  Everything is generated from cv.yml here instead.
#
# One-time setup: Settings -> Pages -> Source -> "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Installs only what the CV needs on top of scheme-basic, and caches it
      # between runs.  If the CV starts loading a new package, add it here.
      - name: Install LaTeX
        uses: TeX-Live/setup-texlive-action@v3
        with:
          packages: |
            scheme-basic
            latexmk
            ec
            enumitem
            etoolbox
            fancyhdr
            fontaxes
            kastrup
            microtype
            mweights
            newtx
            titlesec
            xcolor
            xkeyval
            xpatch
            xstring

      - run: npm ci

      - uses: actions/configure-pages@v5

      - name: Build CV and site
        run: npm run build
        env:
          JEKYLL_ENV: production

      # latexmk runs -quiet, so on failure the actual TeX error is only in the
      # log.  Without this the job reports a bare exit code and nothing else.
      - name: Show LaTeX log on failure
        if: failure()
        run: cat build/cv.log || echo "no build/cv.log was produced"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
